# Supabase CLI configuration for the Khang project.
#
#   supabase link --project-ref <ref>
#   supabase db push            # migrations
#   supabase db reset           # local: migrations + seed.sql
#   supabase functions deploy create-order razorpay razorpay-webhook
#
# https://supabase.com/docs/guides/local-development/cli/getting-started

project_id = "khang"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
# Local development: no inbox to click, so signups are usable immediately.
# On a hosted project, turn "Confirm email" off in Authentication → Providers
# if you want the same one-step signup experience.
enable_signup = true
enable_confirmations = false

[functions.create-order]
verify_jwt = true

[functions.razorpay]
verify_jwt = true

[functions.razorpay-webhook]
# Razorpay has no user session; the HMAC signature in the header is the proof.
verify_jwt = false
