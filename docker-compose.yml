# ─────────────────────────────────────────────────────────────
# Full local stack — one command:
#
#   docker compose up --build
#
#   • MongoDB  → localhost:27017
#   • API      → localhost:5000   (seeded automatically)
#   • Frontend → localhost:5173
#
# Add payment / email credentials to a root `.env` file (optional):
#   RAZORPAY_KEY_ID=...
#   RAZORPAY_KEY_SECRET=...
#   EMAIL_USER=...
#   EMAIL_PASS=...
# ─────────────────────────────────────────────────────────────
services:
  mongo:
    image: mongo:7
    container_name: khang-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: ./backend
    container_name: khang-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/khang
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-prod}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_SECURE: "false"
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ORDER_NOTIFY_EMAIL: ${ORDER_NOTIFY_EMAIL:-sultham456@gmail.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@khang.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    command: sh -c "node src/scripts/seed.js && node src/server.js"

  web:
    image: node:20-alpine
    container_name: khang-web
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://api:5000
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    depends_on:
      - api

volumes:
  mongo-data:
