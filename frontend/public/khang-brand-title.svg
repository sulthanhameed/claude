<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
<title>Khang Chinese Restaurant &amp; Dimsum — brand clip</title>
<style>
  /* one 2.6 s cycle: the badge lands, the name is written on, the eyebrow
     opens, the lockup holds, then it dissolves so the loop is seamless */
  .badge { animation: badge 2.6s cubic-bezier(.22,.9,.3,1) infinite both;
           transform-origin: 500px 466px; }
  .name  { animation: name 2.6s linear infinite both; }
  .wipe  { animation: wipe 2.6s cubic-bezier(.5,0,.2,1) infinite both; }
  .sub   { animation: sub 2.6s cubic-bezier(.22,.9,.3,1) infinite both;
           transform-origin: 500px 554px; }

  @keyframes badge {
    0%   { opacity: 0; transform: scale(.74); }
    9%   { opacity: 1; transform: scale(1.07); }
    13.85%  { opacity: 1; transform: scale(1); }
    80%  { opacity: 1; transform: scale(1); }
    98%  { opacity: 0; transform: scale(1); }
    100% { opacity: 0; transform: scale(1); }
  }
  @keyframes name {
    0%, 10.00% { opacity: 0; }
    16.15% { opacity: 1; }
    80% { opacity: 1; }
    98%, 100% { opacity: 0; }
  }
  @keyframes wipe {
    0%, 10.00% { transform: translateX(0); }
    100% { transform: translateX(134.83px); }
  }
  @keyframes sub {
    0%, 26.92% { opacity: 0; transform: scaleX(.92); }
    43.08% { opacity: .62; transform: scaleX(1); }
    80% { opacity: .62; transform: scaleX(1); }
    98%, 100% { opacity: 0; transform: scaleX(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .badge, .name, .sub { animation: none; opacity: 1; transform: none; }
    .badge { opacity: 1; } .sub { opacity: .62; }
    .wipe { animation: none; transform: translateX(134.83px); }
  }
</style>

<rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

